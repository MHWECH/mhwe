{% extends 'base.html' %}
{% block title %}Erfolgreich gesendet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 text-center">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <div class="success-icon mb-4">✓</div>
                <h2 class="h3 mb-3">Vielen Dank!</h2>
                <p class="text-muted lead">
                    {% if config %}{{ config.success_message }}
                    {% else %}Ihre Einsendung wurde erfolgreich gespeichert.{% endif %}
                </p>
                <a href="{{ url_for('index') }}" class="btn btn-outline-primary mt-3">
                    Zurück zum Formular
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

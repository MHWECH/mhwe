<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Formular{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="public-body">
    <div class="container py-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Blink Donation Button widget -->
    <div class="container pb-4">
        <div id="blink-pay-button-container" class="blink-donation"></div>
    </div>

    <footer class="site-footer text-center py-3">
        <small class="text-muted">&copy; {{ current_year }} – Danke für deine Unterstützung ⚡</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Blink Donation Button script -->
    <script src="https://blinkbitcoin.github.io/donation-button.blink.sv/js/blink-pay-button.js"></script>
    <script>
      // Initialize widget when script is loaded
      function initBlinkWidget() {
        if (typeof BlinkPayButton !== 'undefined') {
          BlinkPayButton.init({
            username: 'mhwe',
            containerId: 'blink-pay-button-container',
            themeMode: 'light',
            language: 'de',
            defaultAmount: 1000,
            supportedCurrencies: [
              {
                "code": "sats",
                "name": "sats",
                "isCrypto": true
              },
              {
                "code": "USD",
                "name": "USD",
                "isCrypto": false
              }
            ],
            debug: false
          });
        } else {
          // Try again in 100ms if BlinkPayButton isn't loaded yet
          setTimeout(initBlinkWidget, 100);
        }
      }

      // Initialize when DOM is ready or now if already loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initBlinkWidget);
      } else {
        initBlinkWidget();
      }
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>

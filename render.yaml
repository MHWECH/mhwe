# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: formular-app
    runtime: python
    region: frankfurt
    plan: starter            # a persistent disk needs a paid instance
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INSTANCE_DIR     # DB, keys, uploads and mail archive survive deploys
        value: /var/data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD   # asked once when the Blueprint is created
        sync: false
